<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSEO</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="header">
    <span class="mark" aria-hidden="true"><i class="icon i-gauge"></i></span>
    <strong class="wordmark t-small-title">SSEO</strong>
    <button id="rerun" class="icon-btn" title="Re-audit this page" aria-label="Re-audit this page" hidden><i class="icon i-refresh"></i></button>
    <button id="open-dashboard" class="btn btn-primary"><i class="icon i-dashboard"></i>Dashboard</button>
  </header>
  <section id="page" class="card page" hidden>
    <span class="favicon"><i class="icon i-globe"></i></span>
    <div class="page-text">
      <p id="url" class="t-strong"></p>
      <p id="meta" class="t-meta"></p>
    </div>
  </section>
  <div id="job"></div>
  <main id="view"></main>
  <section id="bulk" class="more" aria-label="Audit more pages"></section>
  <script type="module" src="panel.js"></script>
</body>
</html>
